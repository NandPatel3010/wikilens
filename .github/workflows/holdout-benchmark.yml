name: WikiLens holdout benchmark

on:
  workflow_dispatch:
  push:
    branches: [wikilens-holdout-benchmark]
    paths:
      - '.github/workflows/holdout-benchmark.yml'
      - 'benchmark/holdout-questions.json'
      - 'search/**'

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: search
          POSTGRES_USER: search
          POSTGRES_PASSWORD: search
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U search -d search"
          --health-interval 3s --health-timeout 3s --health-retries 15
    env:
      DATABASE_URL: postgresql://search:search@127.0.0.1:5432/search
      SEARCH_TORCH_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies and run tests
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-ingest.txt
          python -m unittest discover -s tests -v
      - name: Build the isolated holdout index
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec -i "$POSTGRES_CONTAINER" psql -U search -d search -v ON_ERROR_STOP=1 < db/schema.sql
          python -m search.dataset --articles 5000 --extra-questions benchmark/holdout-questions.json --output data/wikipedia-holdout.jsonl
          python -m search.evaluate --data data/wikipedia-holdout.jsonl --questions benchmark/holdout-questions.json --coverage-only
          python -m search.ingest --profile plain --data data/wikipedia-holdout.jsonl
      - name: Score all three retrieval modes
        run: |
          python -m search.evaluate --data data/wikipedia-holdout.jsonl --profile plain --questions benchmark/holdout-questions.json --output benchmark/comparison/holdout.json
          cat benchmark/comparison/holdout.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wikilens-holdout-results
          path: benchmark/comparison/holdout.*
