name: Index Wikipedia

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wikilens-corpus-ingestion
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.WIKILENS_DATABASE_URL }}
      SEARCH_TORCH_THREADS: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check database configuration
        run: |
          if [[ -z "$DATABASE_URL" ]]; then
            echo "Configure the WIKILENS_DATABASE_URL Actions secret before running ingestion." >&2
            exit 1
          fi
      - name: Install CPU dependencies
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-ingest.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Download corpus
        run: python -m search.dataset --articles 5000
      - name: Index articles
        run: python -m search.ingest
      - name: Benchmark retrieval
        run: python -m search.evaluate
      - name: Save benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: wikilens-benchmark
          path: |
            benchmark/results.json
            benchmark/results.md
          if-no-files-found: error
