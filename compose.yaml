services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: search
      POSTGRES_USER: search
      POSTGRES_PASSWORD: search
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - search-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U search"]
      interval: 3s
      timeout: 3s
      retries: 15
volumes:
  search-data:
